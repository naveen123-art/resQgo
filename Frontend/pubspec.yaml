name: resqgo_app
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ✅ Core packages
  http: ^1.5.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  fluttertoast: ^9.0.0

  # ✅ Device & location
  device_info_plus: ^12.2.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # ✅ UPI payments
  upi_pay: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.2.18

flutter:
  uses-material-design: true

  assets:
    - assets/my_logo.png
    - assets/qrcode.png
    - assets/app_icon.png
    - assets/splash_image.png

# ✅ App icon configuration
flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

# ✅ Splash screen configuration
flutter_native_splash:
  color: "#8B0000"
  image: "assets/my_logo.png"
  android: true
  ios: true
